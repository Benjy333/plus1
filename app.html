<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plus 1 — Live App (Phase 1)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --paper:#F7F7F5; --ink:#1F2024; --ink-soft:#8B8D97;
  --rose:#FA3E52; --rose-soft:#FFE9EB; --border:#ECEBE7; --white:#FFFFFF;
  --shadow: 0 10px 30px rgba(31,32,36,0.07), 0 2px 8px rgba(31,32,36,0.04);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--paper); font-family:'Manrope',sans-serif; color:var(--ink);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.wrap{ width:100%; max-width:420px; }
.wordmark{ font-weight:800; font-size:22px; text-align:center; margin-bottom:6px; }
.wordmark span{ color:var(--rose); }
.subhead{ text-align:center; color:var(--ink-soft); font-size:12.5px; font-weight:600; margin-bottom:28px; }
.card{ background:var(--white); border-radius:24px; box-shadow:var(--shadow); padding:24px; }
h2{ font-size:17px; margin-bottom:16px; }
label{ font-size:12px; font-weight:700; color:var(--ink-soft); display:block; margin:14px 0 5px; }
input{
  width:100%; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px;
  font-size:14px; font-family:'Manrope',sans-serif; outline:none;
}
input:focus{ border-color:var(--rose); }
.btn{
  width:100%; padding:14px; border-radius:999px; border:none; font-weight:700; font-size:14px;
  cursor:pointer; margin-top:18px; background:var(--rose); color:var(--white);
}
.btn:active{ transform:scale(0.98); }
.switch{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:16px; cursor:pointer; }
.switch b{ color:var(--rose); }
.err{ background:var(--rose-soft); color:var(--rose); font-size:12.5px; font-weight:600; padding:10px 14px; border-radius:10px; margin-top:14px; display:none; }

/* app shell once logged in */
.app{ display:none; width:100%; max-width:420px; height:88vh; background:var(--white); border-radius:28px; box-shadow:var(--shadow); overflow:hidden; display:none; flex-direction:column; }
.app.active{ display:flex; }
.topbar{ padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.topbar .wordmark{ margin:0; font-size:18px; text-align:left; }
.signout{ font-size:12px; color:var(--ink-soft); cursor:pointer; font-weight:600; }
.tabs{ display:flex; border-bottom:1px solid var(--border); }
.tab{ flex:1; text-align:center; padding:12px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; }
.tab.active{ color:var(--rose); border-color:var(--rose); }
.panel{ flex:1; overflow-y:auto; padding:16px 18px; display:none; }
.panel.active{ display:block; }
.person-card{
  display:flex; align-items:center; gap:12px; background:var(--paper); border-radius:16px;
  padding:12px 14px; margin-bottom:10px; cursor:pointer;
}
.avatar{ width:44px; height:44px; border-radius:50%; background:var(--rose); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; }
.person-name{ font-weight:700; font-size:14px; }
.person-sub{ font-size:12px; color:var(--ink-soft); }
.verify-badges{ display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; }
.v-badge{
  font-size:10px; font-weight:700; color:var(--ink-soft);
  background:var(--white); border:1px solid var(--border);
  padding:2px 7px; border-radius:999px;
}
.v-badge.on{ color:var(--rose); border-color:var(--rose-soft); background:var(--rose-soft); }

.view-profile-link{ font-size:12px; font-weight:700; color:var(--rose); cursor:pointer; margin-left:auto; background:var(--rose-soft); padding:7px 12px; border-radius:999px; }
.overlay{ position:absolute; inset:0; background:rgba(31,32,36,0.4); z-index:80; display:none; }
.overlay.active{ display:block; }
.profile-drawer{
  position:absolute; left:0; right:0; bottom:0; background:var(--white);
  border-radius:24px 24px 0 0; z-index:90; max-height:82%;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto; padding:10px 22px 26px;
}
.profile-drawer.active{ transform:translateY(0); }
.drawer-handle{ width:36px; height:4px; background:var(--border); border-radius:2px; margin:8px auto 16px; }
.pf-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.pf-avatar{ width:56px; height:56px; border-radius:50%; background:var(--rose); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; flex-shrink:0; }
.pf-name{ font-weight:800; font-size:17px; }
.pf-sub{ font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-top:2px; }
.pf-section{ padding:12px 0; border-bottom:1px solid var(--border); }
.pf-section:last-child{ border-bottom:none; }
.pf-label{ font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; }
.pf-text{ font-size:13.5px; font-weight:500; line-height:1.5; }
.report-link{ text-align:center; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; padding:10px; margin-top:6px; }
.report-modal-overlay{ position:absolute; inset:0; background:rgba(31,32,36,0.5); z-index:110; display:none; align-items:flex-end; }
.report-modal-overlay.active{ display:flex; }
.report-modal{ background:var(--white); width:100%; border-radius:24px 24px 0 0; padding:22px; }
.report-modal h3{ font-size:16px; margin-bottom:4px; }
.report-modal .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
select.report-select{ width:100%; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px; font-family:'Manrope',sans-serif; outline:none; background:#fff; margin-bottom:10px; }
textarea.report-desc{ width:100%; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; font-size:13.5px; font-family:'Manrope',sans-serif; outline:none; resize:none; min-height:80px; }
.report-cancel{ text-align:center; font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-top:12px; cursor:pointer; }
.empty{ text-align:center; color:var(--ink-soft); font-size:13px; margin-top:40px; }
.person-card.waiting{ background:var(--rose-soft); }
.waiting-badge{
  display:inline-block; background:var(--rose); color:#fff; font-size:10px; font-weight:800;
  padding:2px 7px; border-radius:999px; vertical-align:middle; margin-left:4px;
}

.chat-header{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); }
.back{ cursor:pointer; font-size:18px; }
.messages{ flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:8px; background:var(--paper); }
.bubble{ max-width:75%; padding:10px 14px; border-radius:18px; font-size:13.5px; line-height:1.4; }
.bubble.me{ align-self:flex-end; background:var(--rose); color:#fff; border-bottom-right-radius:5px; }
.bubble.them{ align-self:flex-start; background:var(--white); box-shadow:0 2px 8px rgba(31,32,36,0.05); border-bottom-left-radius:5px; }
.input-row{ display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--border); }
.input-row input{ flex:1; border-radius:999px; }
.send{ width:42px; height:42px; border-radius:50%; background:var(--rose); color:#fff; border:none; cursor:pointer; font-size:15px; flex-shrink:0; }

.info-hero{ text-align:center; padding:10px 6px 22px; }
.info-hero .title{ font-weight:800; font-size:18px; }
.info-hero .sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; font-weight:500; }
.info-card{
  background:var(--paper); border-radius:16px; padding:14px 16px; margin-bottom:10px;
  display:flex; gap:12px; align-items:flex-start;
}
.info-num{
  width:28px; height:28px; border-radius:50%; background:var(--rose); color:#fff;
  font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.info-card-title{ font-weight:700; font-size:13.5px; margin-bottom:2px; }
.info-card-text{ font-size:12px; color:var(--ink-soft); font-weight:500; line-height:1.45; }
.info-cta{
  display:block; text-align:center; text-decoration:none; background:var(--rose); color:#fff;
  font-weight:700; font-size:13.5px; padding:14px; border-radius:999px; margin-top:8px;
}
.info-cta-sub{ text-align:center; font-size:11px; color:var(--ink-soft); font-weight:500; margin-top:8px; }

@media (max-width: 480px){
  body{ padding:0; align-items:stretch; }
  .wrap{ max-width:100%; display:flex; flex-direction:column; justify-content:center; min-height:100vh; padding:24px; }
  .card{ box-shadow:none; border-radius:0; }
  .app{
    max-width:100%;
    width:100vw;
    height:100vh;
    height:100dvh;
    border-radius:0;
    box-shadow:none;
  }
  .app.active{ display:flex; }
}
</style>
</head>
<body>

<!-- ========== AUTH SCREEN ========== -->
<div class="wrap" id="authScreen">
  <div class="wordmark">Plus<span>+1</span></div>
  <div class="subhead">THE NO-SWIPE DATING APP</div>
  <div class="card">
    <h2 id="authTitle">Log in</h2>
    <div id="nameField" style="display:none;">
      <label>Your name</label>
      <input type="text" id="nameInput" placeholder="Jordan">
      <label>Age</label>
      <input type="number" id="ageInput" placeholder="29" min="18" max="99">
      <label>Gender</label>
      <select id="genderInput" style="width:100%; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px; font-family:'Manrope',sans-serif; outline:none; background:#fff;">
        <option value="">Select...</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <label>Brisbane suburb</label>
      <input type="text" id="suburbInput" placeholder="New Farm">
      <label>Profession</label>
      <input type="text" id="professionInput" placeholder="Photographer">
      <label>A few interests</label>
      <input type="text" id="interestsInput" placeholder="Hiking, film photography, vinyl">
      <div style="font-size:11px; color:var(--ink-soft); margin-top:10px; line-height:1.4;">Trust builds in 3 steps: <b>email</b>, <b>ID</b>, and <b>in-person</b> verification at a Plus 1 meetup. You'll start with none checked off.</div>
    </div>
    <label>Email</label>
    <input type="email" id="emailInput" placeholder="you@email.com">
    <label>Password</label>
    <input type="password" id="passInput" placeholder="At least 6 characters">
    <button class="btn" id="authBtn">Log in</button>
    <div class="err" id="authErr"></div>
    <div class="switch" id="authSwitch">New here? <b>Create an account</b></div>
  </div>
</div>

<!-- ========== APP SHELL ========== -->
<div class="app" id="app">
  <div class="topbar">
    <div class="wordmark">Plus<span>+1</span></div>
    <div class="signout" id="signOutBtn">Sign out</div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="people" onclick="switchTab('people')">People</div>
    <div class="tab" data-tab="chats" onclick="switchTab('chats')">Chats</div>
    <div class="tab" data-tab="profile" onclick="switchTab('profile')">Profile</div>
    <div class="tab" data-tab="info" onclick="switchTab('info')">Info</div>
  </div>
  <div class="panel active" id="panel-people"></div>
  <div class="panel" id="panel-chats"></div>
  <div class="panel" id="panel-profile"></div>
  <div class="panel" id="panel-info"></div>
  <div class="panel" id="panel-chat" style="padding:0; display:none; flex-direction:column;"></div>

  <div class="overlay" id="profileOverlay" onclick="closeProfile()"></div>
  <div class="profile-drawer" id="profileDrawer"></div>

  <div class="report-modal-overlay" id="reportOverlay"></div>
</div>

<script>
// ============================================================
// CONFIG — paste your Supabase project details here
// Find these in Supabase Dashboard > Project Settings > API
// ============================================================
const SUPABASE_URL = "https://rkykfarljdbaytvyppme.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rFGDY8vlPru-tQ3h1X2X-A_rScuKjrF";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let activeConversation = null;
let messageChannel = null;

function initials(name){ return (name||'?')[0].toUpperCase(); }

// ---------- AUTH ----------
let mode = 'login'; // or 'signup'

document.getElementById('authSwitch').onclick = () => {
  mode = mode === 'login' ? 'signup' : 'login';
  document.getElementById('authTitle').textContent = mode === 'login' ? 'Log in' : 'Create your account';
  document.getElementById('authBtn').textContent = mode === 'login' ? 'Log in' : 'Sign up';
  document.getElementById('nameField').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('authSwitch').innerHTML = mode === 'login'
    ? 'New here? <b>Create an account</b>' : 'Already have an account? <b>Log in</b>';
  document.getElementById('authErr').style.display = 'none';
};

document.getElementById('authBtn').onclick = async () => {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passInput').value;
  const name = document.getElementById('nameInput').value.trim();
  const age = document.getElementById('ageInput').value.trim();
  const gender = document.getElementById('genderInput').value;
  const suburb = document.getElementById('suburbInput').value.trim();
  const profession = document.getElementById('professionInput').value.trim();
  const interests = document.getElementById('interestsInput').value.trim();
  const errBox = document.getElementById('authErr');
  errBox.style.display = 'none';
  errBox.style.color = 'var(--rose)';

  if(!email || !password || (mode==='signup' && (!name || !age || !gender || !suburb))){
    errBox.textContent = mode === 'signup'
      ? 'Please fill in name, age, gender, and suburb at least.'
      : 'Please fill in every field.';
    errBox.style.display = 'block';
    return;
  }

  if(mode === 'signup'){
    const { data, error } = await sb.auth.signUp({
      email, password, options: { data: { name } }
    });
    if(error){ errBox.textContent = error.message; errBox.style.display='block'; return; }
    if(data.session){
      // fill in the bio fields on the auto-created profile row
      await sb.from('profiles').update({
        age: age ? parseInt(age) : null,
        gender, suburb, profession, interests,
        email_verified: false, id_verified: false, meetup_verified: false
      }).eq('id', data.user.id);
      await onLoggedIn();
    }
    else { errBox.style.color = 'var(--ink)'; errBox.textContent = 'Check your email to confirm your account, then log in.'; errBox.style.display='block'; }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errBox.textContent = error.message; errBox.style.display='block'; return; }
    await onLoggedIn();
  }
};

document.getElementById('signOutBtn').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

async function onLoggedIn(){
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = profile;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  loadPeople();
  loadChats();
}

// ---------- PEOPLE TAB ----------
async function loadPeople(){
  const panel = document.getElementById('panel-people');
  const { data: people, error } = await sb.from('profiles').select('*').neq('id', currentUser.id);
  if(error || !people || people.length === 0){
    panel.innerHTML = `<div class="empty">No one else has signed up yet.<br>Invite a friend to test messaging with you!</div>`;
    return;
  }
  panel.innerHTML = people.map(p => `
    <div class="person-card">
      <div class="avatar" onclick="event.stopPropagation(); openProfile('${p.id}')" style="cursor:pointer;">${initials(p.name)}</div>
      <div onclick="startConversation('${p.id}')" style="flex:1; cursor:pointer;">
        <div class="person-name">${p.name}${p.age ? ', ' + p.age : ''}</div>
        <div class="person-sub">${[p.profession, p.suburb].filter(Boolean).join(' · ') || p.tagline || 'Say hello'}</div>
        <div class="verify-badges">${verificationBadges(p)}</div>
      </div>
    </div>`).join('');
}

function verificationBadges(p){
  const tiers = [
    { key: 'email_verified', label: 'Email' },
    { key: 'id_verified', label: 'ID' },
    { key: 'meetup_verified', label: 'In person' },
  ];
  const badges = tiers.map(t => {
    const on = !!p[t.key];
    return `<span class="v-badge ${on ? 'on' : ''}">${on ? '&#9989;' : '&#9675;'} ${t.label}</span>`;
  });
  const referred = !!p.referred_by;
  badges.push(`<span class="v-badge ${referred ? 'on' : ''}">${referred ? '&#9989;' : '&#9675;'} Referred</span>`);
  return badges.join('');
}

async function startConversation(otherId){
  // check for an existing conversation between these two people
  const { data: existing } = await sb.from('conversations')
    .select('*')
    .or(`and(user_a.eq.${currentUser.id},user_b.eq.${otherId}),and(user_a.eq.${otherId},user_b.eq.${currentUser.id})`)
    .maybeSingle();

  let convo = existing;
  if(!convo){
    const { data: created, error } = await sb.from('conversations')
      .insert({ user_a: currentUser.id, user_b: otherId })
      .select().single();
    if(error){ alert(error.message); return; }
    convo = created;
  }
  openChat(convo.id, otherId);
}

// ---------- CHATS TAB ----------
async function loadChats(){
  const panel = document.getElementById('panel-chats');
  const { data: convos } = await sb.from('conversations')
    .select('*')
    .or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`)
    .order('last_message_at', { ascending: false });

  if(!convos || convos.length === 0){
    panel.innerHTML = `<div class="empty">No conversations yet.<br>Go to People to say hello.</div>`;
    return;
  }
  const otherIds = convos.map(c => c.user_a === currentUser.id ? c.user_b : c.user_a);
  const { data: profiles } = await sb.from('profiles').select('*').in('id', otherIds);
  const profileMap = Object.fromEntries((profiles||[]).map(p => [p.id, p]));

  panel.innerHTML = convos.map(c => {
    const otherId = c.user_a === currentUser.id ? c.user_b : c.user_a;
    const p = profileMap[otherId] || { name: 'Unknown' };
    const waiting = c.last_sender_id && c.last_sender_id !== currentUser.id;
    return `
      <div class="person-card ${waiting ? 'waiting' : ''}" onclick="openChat('${c.id}','${otherId}')">
        <div class="avatar">${initials(p.name)}</div>
        <div style="flex:1;">
          <div class="person-name">${p.name} ${waiting ? '<span class="waiting-badge">New</span>' : ''}</div>
          <div class="person-sub">${c.message_count} messages</div>
        </div>
      </div>`;
  }).join('');
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('panel-people').classList.toggle('active', tab === 'people');
  document.getElementById('panel-chats').classList.toggle('active', tab === 'chats');
  document.getElementById('panel-profile').classList.toggle('active', tab === 'profile');
  document.getElementById('panel-info').classList.toggle('active', tab === 'info');
  document.getElementById('panel-chat').style.display = 'none';
  if(tab === 'chats') loadChats();
  if(tab === 'info') renderInfoTab();
  if(tab === 'profile') renderProfileTab();
}

async function renderProfileTab(){
  const panel = document.getElementById('panel-profile');
  const { data: p } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = p;
  const genderLabel = p.gender ? (p.gender.toLowerCase()==='male'?'Male':p.gender.toLowerCase()==='female'?'Female':p.gender) : null;

  panel.innerHTML = `
    <div class="pf-head" style="margin-top:8px;">
      <div class="pf-avatar" style="width:56px;height:56px;font-size:20px;">${initials(p.name)}</div>
      <div>
        <div class="pf-name">${p.name}${p.age ? ', ' + p.age : ''}</div>
        <div class="pf-sub">${[genderLabel, p.profession, p.suburb].filter(Boolean).join(' · ') || ''}</div>
      </div>
    </div>
    <div class="verify-badges" style="margin-bottom:10px;">${verificationBadges(p)}</div>
    ${p.bio ? `<div class="pf-section"><div class="pf-label">About</div><div class="pf-text">${p.bio}</div></div>` : ''}
    ${p.interests ? `<div class="pf-section"><div class="pf-label">Interests</div><div class="pf-text">${p.interests}</div></div>` : ''}
    ${p.tagline ? `<div class="pf-section"><div class="pf-label">Tagline</div><div class="pf-text">${p.tagline}</div></div>` : ''}
    <div class="info-cta-sub" style="margin-top:16px;">This is what other people see about you.</div>`;
}

function renderInfoTab(){
  const panel = document.getElementById('panel-info');
  panel.innerHTML = `
    <div class="info-hero">
      <div class="title">How Plus 1 works</div>
      <div class="sub">The <span style="color:var(--rose); font-weight:700;">no-swipe</span> dating app.</div>
    </div>
    <div class="info-card">
      <div class="info-num">1</div>
      <div>
        <div class="info-card-title">One match a day</div>
        <div class="info-card-text">No feed to scroll. Just one person, chosen for you, every day.</div>
      </div>
    </div>
    <div class="info-card">
      <div class="info-num">2</div>
      <div>
        <div class="info-card-title">Keep it or let it go</div>
        <div class="info-card-text">Decide the same day. If you let it go, your next match arrives tomorrow.</div>
      </div>
    </div>
    <div class="info-card">
      <div class="info-num">3</div>
      <div>
        <div class="info-card-title">Only 3 conversations at once</div>
        <div class="info-card-text">Want a 4th? You'll need to let one of your current 3 go first.</div>
      </div>
    </div>
    <div class="info-card">
      <div class="info-num">4</div>
      <div>
        <div class="info-card-title">Profiles unlock as you talk</div>
        <div class="info-card-text">You start with the basics. Keep messaging to unlock more of who they are.</div>
      </div>
    </div>
    <a class="info-cta" href="plus1-pitch.pdf" target="_blank" rel="noopener">Read the full pitch deck</a>
    <div class="info-cta-sub">Problem, market, business model, and go-to-market plan</div>

    <div class="pf-label" style="margin-top:24px;">Refer friends</div>
    <div class="info-card-text" style="margin-bottom:10px;">You can refer up to 3 people. Once they sign up with the email you add, they'll show as "Referred" verified.</div>
    <div id="referralList"></div>
    <div id="referralForm" style="display:flex; gap:8px; margin-top:8px;">
      <input type="email" id="referralEmailInput" placeholder="friend@email.com" style="flex:1; border:1.5px solid var(--border); border-radius:12px; padding:11px 13px; font-size:13px; font-family:'Manrope',sans-serif; outline:none;">
      <button class="send" onclick="addReferral()" style="width:auto; padding:0 16px; border-radius:12px;">Add</button>
    </div>
    <div class="err" id="referralErr" style="display:none;"></div>

    <div class="pf-label" style="margin-top:24px;">Report a problem</div>
    <div class="info-card-text" style="margin-bottom:10px;">Something not working, or a safety concern that isn't about a specific person? Let us know.</div>
    <div class="report-link" onclick="openReportModal(null, null)">&#9873; Report a problem</div>`;
  loadReferrals();
}

async function loadReferrals(){
  const { data: referrals } = await sb.from('referrals').select('*').eq('referrer_id', currentUser.id).order('created_at');
  const list = document.getElementById('referralList');
  const form = document.getElementById('referralForm');
  if(!list) return;

  list.innerHTML = (referrals || []).map(r => `
    <div class="info-card" style="padding:10px 14px; margin-bottom:6px;">
      <div style="flex:1;">
        <div class="info-card-title" style="margin-bottom:0;">${r.referred_email}</div>
        <div class="info-card-text">${r.status === 'joined' ? '&#9989; Joined' : 'Invited, waiting for them to sign up'}</div>
      </div>
    </div>`).join('');

  const count = (referrals || []).length;
  if(count >= 3 && form) form.style.display = 'none';
}

async function addReferral(){
  const input = document.getElementById('referralEmailInput');
  const errBox = document.getElementById('referralErr');
  const email = input.value.trim();
  errBox.style.display = 'none';
  if(!email || !email.includes('@')){
    errBox.textContent = 'Enter a valid email.';
    errBox.style.display = 'block';
    return;
  }
  const { error } = await sb.from('referrals').insert({ referrer_id: currentUser.id, referred_email: email });
  if(error){
    errBox.textContent = error.message.includes('up to 3') ? 'You\'ve already referred 3 people.' : error.message;
    errBox.style.display = 'block';
    return;
  }
  input.value = '';
  loadReferrals();
}

// ---------- REPORT A PERSON / REPORT A PROBLEM ----------
function openReportModal(reportedUserId, reportedName){
  const overlay = document.getElementById('reportOverlay');
  const isPerson = !!reportedUserId;
  const categoryOptions = isPerson
    ? `<option value="fake_profile">Fake profile</option>
       <option value="harassment">Harassment or abuse</option>
       <option value="inappropriate">Inappropriate content</option>
       <option value="safety">Safety concern</option>
       <option value="other">Other</option>`
    : `<option value="technical">Something's broken</option>
       <option value="safety">Safety concern</option>
       <option value="other">Other</option>`;

  overlay.innerHTML = `
    <div class="report-modal">
      <h3>${isPerson ? 'Report ' + reportedName : 'Report a problem'}</h3>
      <div class="sub">${isPerson ? 'This is sent privately — they won\'t be notified.' : 'Tell us what happened.'}</div>
      <select class="report-select" id="reportCategory">${categoryOptions}</select>
      <textarea class="report-desc" id="reportDescription" placeholder="${isPerson ? 'What happened?' : 'Describe the issue...'}"></textarea>
      <div class="err" id="reportErr" style="display:none;"></div>
      <button class="btn" onclick="submitReport(${reportedUserId ? `'${reportedUserId}'` : 'null'})">Submit report</button>
      <div class="report-cancel" onclick="closeReportModal()">Cancel</div>
    </div>`;
  overlay.classList.add('active');
}

function closeReportModal(){
  document.getElementById('reportOverlay').classList.remove('active');
}

async function submitReport(reportedUserId){
  const category = document.getElementById('reportCategory').value;
  const description = document.getElementById('reportDescription').value.trim();
  const errBox = document.getElementById('reportErr');

  const { error } = await sb.from('reports').insert({
    reporter_id: currentUser.id,
    reported_user_id: reportedUserId,
    category, description
  });

  if(error){
    errBox.textContent = error.message;
    errBox.style.display = 'block';
    return;
  }
  closeReportModal();
  closeProfile();
  alert('Thanks — your report has been submitted.');
}

// ---------- VIEW PROFILE ----------
async function openProfile(userId){
  const { data: p } = await sb.from('profiles').select('*').eq('id', userId).single();
  if(!p) return;
  const drawer = document.getElementById('profileDrawer');
  drawer.innerHTML = `
    <div class="drawer-handle"></div>
    <div class="pf-head">
      <div class="pf-avatar">${initials(p.name)}</div>
      <div>
        <div class="pf-name">${p.name}${p.age ? ', ' + p.age : ''}</div>
        <div class="pf-sub">${[p.gender ? (p.gender.toLowerCase()==='male'?'Male':p.gender.toLowerCase()==='female'?'Female':p.gender) : null, p.profession, p.suburb].filter(Boolean).join(' · ') || ''}</div>
      </div>
    </div>
    <div class="verify-badges" style="margin-bottom:6px;">${verificationBadges(p)}</div>
    ${p.bio ? `<div class="pf-section"><div class="pf-label">About</div><div class="pf-text">${p.bio}</div></div>` : ''}
    ${p.interests ? `<div class="pf-section"><div class="pf-label">Interests</div><div class="pf-text">${p.interests}</div></div>` : ''}
    ${p.tagline ? `<div class="pf-section"><div class="pf-label">Tagline</div><div class="pf-text">${p.tagline}</div></div>` : ''}
    <div class="report-link" onclick="openReportModal('${p.id}', '${(p.name||'').replace(/'/g,"\\'")}')">&#9873; Report ${p.name}</div>
  `;
  drawer.classList.add('active');
  document.getElementById('profileOverlay').classList.add('active');
}

function closeProfile(){
  document.getElementById('profileDrawer').classList.remove('active');
  document.getElementById('profileOverlay').classList.remove('active');
}

// ---------- CHAT SCREEN ----------
async function openChat(conversationId, otherId){
  activeConversation = conversationId;
  document.getElementById('panel-people').classList.remove('active');
  document.getElementById('panel-chats').classList.remove('active');
  const chatPanel = document.getElementById('panel-chat');
  chatPanel.style.display = 'flex';

  const { data: other } = await sb.from('profiles').select('*').eq('id', otherId).single();

  chatPanel.innerHTML = `
    <div class="chat-header">
      <div class="back" onclick="switchTab('chats')">&#8592;</div>
      <div class="avatar" style="width:36px;height:36px;font-size:13px;">${initials(other.name)}</div>
      <div class="person-name">${other.name}</div>
      <div class="view-profile-link" onclick="openProfile('${other.id}')">View Profile</div>
    </div>
    <div class="messages" id="msgList"></div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Message ${other.name}...">
      <button class="send" onclick="sendMessage()">&#8593;</button>
    </div>`;

  document.getElementById('msgInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') sendMessage();
  });

  await loadMessages(conversationId);
  subscribeToMessages(conversationId);
}

async function loadMessages(conversationId){
  const { data: messages } = await sb.from('messages')
    .select('*').eq('conversation_id', conversationId).order('created_at', { ascending: true });
  renderMessages(messages || []);
}

function renderMessages(messages){
  const list = document.getElementById('msgList');
  if(!list) return;
  list.innerHTML = messages.map(m => `
    <div class="bubble ${m.sender_id === currentUser.id ? 'me' : 'them'}">${escapeHtml(m.body)}</div>
  `).join('');
  list.scrollTop = list.scrollHeight;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function subscribeToMessages(conversationId){
  if(messageChannel) sb.removeChannel(messageChannel);
  messageChannel = sb.channel('messages-' + conversationId)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `conversation_id=eq.${conversationId}`
    }, () => {
      loadMessages(conversationId);
    })
    .subscribe();
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  if(!body) return;
  input.value = '';
  const { error } = await sb.from('messages').insert({
    conversation_id: activeConversation,
    sender_id: currentUser.id,
    body
  });
  if(error) alert(error.message);
}

// ---------- ON LOAD: resume session if already logged in ----------
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await onLoggedIn(); }
})();
</script>
